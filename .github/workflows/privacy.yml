name: Privacy and checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Runs before dependencies install, so no package script can affect the result.
      - run: node scripts/privacy-check.mjs

  check:
    runs-on: ubuntu-latest
    needs: privacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      # The browser's files must never hold a secret key.
      - run: "! grep -rlE 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|ANTHROPIC_API_KEY|ADMIN_PASSWORD_HASH|ADMIN_SESSION_SECRET' .next/static"
